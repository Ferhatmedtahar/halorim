<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowframe Core v0 Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #wallpaper-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div><strong>Glowframe Core v0</strong></div>
    <div>Move cursor to guide rim light &bull; Idle orbit after 3s</div>
  </div>
  <canvas id="wallpaper-canvas"></canvas>

  <script type="module">
    import { createRenderer, BrowserInput, exampleScene } from '../dist/index.js';

    window.createRenderer = createRenderer;
    window.BrowserInput = BrowserInput;
    window.exampleScene = exampleScene;

    const canvas = document.getElementById('wallpaper-canvas');
    const input = new BrowserInput(canvas);

    const renderer = createRenderer({
      canvas,
      scene: exampleScene,
      input,
    });

    window.renderer = renderer;

    function handleResize() {
      renderer.resize(window.innerWidth, window.innerHeight, window.devicePixelRatio);
    }

    window.addEventListener('resize', handleResize);
    handleResize();

    renderer.start();
    window.__glowframeReady = true;
  </script>
</body>
</html>
