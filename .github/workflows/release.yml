name: Release

# Builds the desktop installers on GitHub's machines and attaches them to a DRAFT GitHub Release.
# Start it by pushing a version tag:   git tag v0.1.0 && git push origin v0.1.0
# (or run it by hand from the Actions tab). Review the draft, then press "Publish release".
#
#   Windows 10/11            *_x64-setup.exe (NSIS) and *_x64_en-US.msi
#   Ubuntu/Debian/Mint/Pop   *_amd64.deb
#   Fedora/openSUSE          *.x86_64.rpm
#   Arch and any other       *_amd64.AppImage (runs on any distro, no install needed)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    permissions:
      contents: write # tauri-action creates the draft release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libx11-dev patchelf rpm

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.27.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # The app imports these workspace packages from their built dist/ folders.
      - name: Build shared packages
        run: pnpm --filter @glowframe/schema --filter @glowframe/core --filter @glowframe/presets build

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Halorim ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Download the file for your system:
            - Windows 10 / 11: the `.exe` installer (or the `.msi`)
            - Ubuntu / Debian / Linux Mint / Pop!_OS: the `.deb`
            - Fedora / openSUSE: the `.rpm`
            - Arch and any other Linux: the `.AppImage`
          releaseDraft: true
          prerelease: false
