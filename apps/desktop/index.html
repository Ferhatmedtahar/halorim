<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowframe Desktop Runner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000 !important;
      background-color: #000 !important;
    }
    #wallpaper-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000 !important;
      background-color: #000 !important;
    }
  </style>
</head>
<body>
  <canvas id="wallpaper-canvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
